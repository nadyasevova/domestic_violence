[project]
name = "domestic_violence"
version = "0.1.0"
description = "Data analytics project for registered crimes related to domestic violence in Bulgaria"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "pandas",
    "numpy",
    "xlrd",
    "sqlalchemy",
    "psycopg[binary]",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
